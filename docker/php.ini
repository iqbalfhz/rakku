; Foto struk maksimal 5 MB, PDF invoice butuh memori ekstra.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
expose_php = Off

; Kode di dalam image tidak berubah, jadi OPcache tidak perlu mengecek timestamp file.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
